name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

# Hủy các luồng CI cũ nếu có commit mới được push lên cùng một nhánh
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  # ============================================================
  # JOB 1: Xác thực Docker Compose
  # ============================================================
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml syntax
        run: |
          cp .env.example .env
          docker compose config -q

  # ============================================================
  # JOB 2: Phát hiện các service có file bị thay đổi
  # ============================================================
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      # Trả về một mảng JSON chứa tên các service có thay đổi
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: 'src/api-gateway/**'
            identity-service: 'src/identity-service/**'
            driver-service: 'src/driver-service/**'
            trip-service: 'src/trip-service/**'
            matching-service: 'src/matching-service/**'
            pricing-service: 'src/pricing-service/**'
            payment-service: 'src/payment-service/**'
            notification-service: 'src/notification-service/**'

  # ============================================================
  # JOB 3: Chỉ Build & Test những service bị thay đổi (Dynamic Matrix)
  # ============================================================
  build-test:
    name: Build & Test (${{ matrix.service }})
    needs: detect-changes
    # Chỉ chạy Job này nếu mảng services KHÔNG bị rỗng
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Chuyển đổi chuỗi JSON array thành mảng cho matrix
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    defaults:
      run:
        working-directory: src/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and unit test
        run: ./gradlew clean test --no-daemon --parallel

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}-${{ github.run_number }}
          path: |
            src/${{ matrix.service }}/build/test-results/**
            src/${{ matrix.service }}/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # JOB 4: Integration - Tích hợp toàn hệ thống
  # ============================================================
  integration:
    name: Integration (infra smoke test)
    needs: [validate-compose, build-test]
    # Đảm bảo integration luôn chạy trừ khi build-test bị lỗi (nếu build-test bị skip do không có service nào đổi thì vẫn chạy qua)
    if: always() && needs.build-test.result != 'failure' && needs.build-test.result != 'cancelled' && needs.validate-compose.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure (DBs + Kafka)
        run: |
          cp .env.example .env
          docker compose up -d identity-db driver-db trip-db matching-db payment-db kafka

      - name: Wait for infrastructure to be healthy
        run: |
          echo "Waiting for all DB containers to be healthy..."
          timeout 60 bash -c '
            services="identity-db driver-db trip-db matching-db payment-db kafka"
            for svc in $services; do
              until [ "$(docker inspect --format="{{.State.Health.Status}}" $svc 2>/dev/null)" = "healthy" ]; do
                echo "  Waiting for $svc..."
                sleep 3
              done
              echo "  $svc is healthy"
            done
          '

      - name: Verify Kafka broker is reachable
        run: |
          docker compose exec -T kafka \
            /opt/kafka/bin/kafka-broker-api-versions.sh \
            --bootstrap-server localhost:9092 > /dev/null

      - name: Shutdown
        if: always()
        run: docker compose down -v
