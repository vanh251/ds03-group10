name: Security
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/**'
      - '.github/workflows/**'
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - '.github/workflows/**'
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    # Chỉ chạy trên repo Public (repo Private yêu cầu bản quyền GitHub Advanced Security trả phí)
    if: github.event_name == 'pull_request' && github.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # PR chạy bộ quy tắc tiêu chuẩn để kiểm tra nhanh; chỉ quét sâu (security-extended) khi push/schedule
          queries: ${{ github.event_name == 'pull_request' && 'default' || 'security-extended' }}

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4

      - name: Compile all services for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          for svc in api-gateway identity-service driver-service trip-service \
                     matching-service pricing-service payment-service notification-service; do
            echo "=== Compiling $svc ==="
            (cd src/$svc && ./gradlew classes -x test --build-cache) || true
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Với repo Private không có bản quyền GHAS, không upload lên GitHub API để tránh lỗi Code scanning is not enabled
          upload: ${{ github.repository.private && 'never' || 'always' }}
          output: sarif-results

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore
          retention-days: 7
